name: Nova Build Nightly Wheels

on:
  push:
    branches:
      - nightly
  pull_request:
    paths:
      - .ci/**/*
      - .github/workflows/build-wheels-nightly.yml
      - pyproject.toml
      - setup.py
  schedule:
    # 11:30 UTC, the time pytorch/test-infra's trigger_nightly.yml used to cut
    # domain-library nightly branches.
    - cron: 30 11 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cut the nightly branch here because pytorchbot cannot write to repositories
  # in the meta-pytorch organization. GITHUB_TOKEN needs no cross-org grant.
  #
  # A push made with GITHUB_TOKEN does not start a new workflow run, so the
  # scheduled run continues below and builds the commit that was just pushed.
  cut-nightly:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Create nightly commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          parent=()
          if git fetch origin nightly; then
            parent=(-p FETCH_HEAD)
          fi

          HEAD_COMMIT_HASH=$(git rev-parse HEAD)
          NIGHTLY_DATE=$(date +"%Y-%m-%d")
          NIGHTLY_RELEASE_COMMIT=$(git commit-tree "${parent[@]}" "HEAD^{tree}" \
            -m "${NIGHTLY_DATE} nightly release (${HEAD_COMMIT_HASH})")
          git push -f origin "${NIGHTLY_RELEASE_COMMIT}:nightly"

  generate-linux-matrix:
    needs: cut-nightly
    if: ${{ !failure() && !cancelled() }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@release/2.12
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      with-cuda: disabled
      with-rocm: disabled
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  build-linux:
    needs: [cut-nightly, generate-linux-matrix]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@release/2.12
    with:
      repository: meta-pytorch/tokenizers
      ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      build-matrix: ${{ needs.generate-linux-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      package-name: pytorch_tokenizers
      pre-script: .ci/scripts/wheel/pre_build_script.sh
      smoke-test-script: .ci/scripts/wheel/test_wheel.py

  generate-linux-aarch64-matrix:
    needs: cut-nightly
    if: ${{ !failure() && !cancelled() }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@release/2.12
    with:
      package-type: wheel
      os: linux-aarch64
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      with-cuda: disabled
      with-rocm: disabled
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  build-linux-aarch64:
    needs: [cut-nightly, generate-linux-aarch64-matrix]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@release/2.12
    with:
      repository: meta-pytorch/tokenizers
      ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      build-matrix: ${{ needs.generate-linux-aarch64-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      package-name: pytorch_tokenizers
      pre-script: .ci/scripts/wheel/pre_build_script.sh
      smoke-test-script: .ci/scripts/wheel/test_wheel.py
      architecture: aarch64

  generate-macos-arm64-matrix:
    needs: cut-nightly
    if: ${{ !failure() && !cancelled() }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@release/2.12
    with:
      package-type: wheel
      os: macos-arm64
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      with-cuda: disabled
      with-rocm: disabled
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  build-macos-arm64:
    needs: [cut-nightly, generate-macos-arm64-matrix]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
    uses: pytorch/test-infra/.github/workflows/build_wheels_macos.yml@release/2.12
    with:
      repository: meta-pytorch/tokenizers
      ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      build-matrix: ${{ needs.generate-macos-arm64-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      package-name: pytorch_tokenizers
      runner-type: macos-14-xlarge
      setup-miniconda: true
      delocate-wheel: false
      smoke-test-script: .ci/scripts/wheel/test_wheel.py

  generate-windows-matrix:
    needs: cut-nightly
    if: ${{ !failure() && !cancelled() }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@release/2.12
    with:
      package-type: wheel
      os: windows
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      with-cuda: disabled
      with-rocm: disabled
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  build-windows:
    needs: [cut-nightly, generate-windows-matrix]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
    uses: pytorch/test-infra/.github/workflows/build_wheels_windows.yml@release/2.12
    with:
      repository: meta-pytorch/tokenizers
      ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: release/2.12
      build-matrix: ${{ needs.generate-windows-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      package-name: pytorch_tokenizers
      pre-script: .ci/scripts/wheel/pre_build_script.sh
      env-script: .ci\\scripts\\wheel\\vc_env_helper.bat
      smoke-test-script: .ci/scripts/wheel/test_wheel.py
